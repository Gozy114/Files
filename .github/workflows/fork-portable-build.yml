# Unpackaged x64 build for this fork. The artifact is a zip of the Files.exe
# output folder. It is not an MSIX and it is not signed.

name: Fork portable build

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/everything-search-folder-size-4681

env:
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'

jobs:

  package:

    runs-on: windows-latest

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=x64 `
          -p:Configuration=Debug `
          -p:PublishReadyToRun=true `
          -v:quiet

    - name: Build unpackaged Files
      shell: pwsh
      run: |
        msbuild `
          -warnaserror `
          -warnnotaserror:CS0612,CS0618,CS0672,IL2104 `
          $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=Debug `
          -p:Platform=x64 `
          -p:AppxBundle=Never `
          -p:GenerateAppxPackageOnBuild=false `
          -v:quiet

    - name: Stage portable output
      id: stage
      shell: pwsh
      run: |
        $bin = Join-Path $env:GITHUB_WORKSPACE 'src\Files.App\bin'
        Get-ChildItem -Path $bin -Recurse -Include Files.exe,Everything32.dll,Everything64.dll,EverythingARM64.dll -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host $_.FullName }

        $output = $null
        $exes = Get-ChildItem -Path $bin -Recurse -Filter Files.exe |
          Where-Object { $_.FullName -notmatch '\\obj\\|\\ref\\' }
        foreach ($candidate in $exes) {
          $dir = $candidate.Directory
          while ($null -ne $dir -and $dir.FullName.StartsWith($bin, [StringComparison]::OrdinalIgnoreCase)) {
            $dll = Get-ChildItem -Path $dir.FullName -Recurse -Filter Everything64.dll -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -ne $dll -and $dir.FullName -ne $bin) {
              $output = $dir.FullName
              break
            }
            if ($dir.FullName -eq $bin) { break }
            $dir = $dir.Parent
          }
          if ($null -ne $output) { break }
        }
        if (-not $output) {
          throw 'Files.exe and Everything64.dll were not in the same unpackaged build folder.'
        }

        $stage = Join-Path $env:GITHUB_WORKSPACE 'portable-stage'
        if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
        New-Item -ItemType Directory -Path $stage | Out-Null
        Copy-Item -Path (Join-Path $output '*') -Destination $stage -Recurse

        @(
          'Files portable x64 (unpackaged Debug build).'
          ''
          'Unzip this folder and run Files.exe. This is not an MSIX.'
          'Do not install a certificate and do not use Add-AppxPackage.'
          ''
          'The .NET 10 runtime is included in this folder.'
          ''
          'Windows App Runtime is not included. AppxManifest.xml requires'
          'Microsoft.WindowsAppRuntime.2 version 2.5.1.0 or newer.'
          'Install the x64 Windows App Runtime 2.5 from:'
          'https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads'
          'The bootstrap DLLs next to Files.exe load that installed runtime.'
          ''
          'Everything search and folder sizes stay off until you enable'
          '"Use Everything for search and folder sizes" and voidtools Everything is running.'
          'The Everything client DLLs are in the Libraries folder.'
        ) | Set-Content -Path (Join-Path $stage 'README.txt') -Encoding utf8

        Write-Host "Staged $output"
        "dir=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload portable build
      uses: actions/upload-artifact@v7
      with:
        name: Files-portable-x64
        path: ${{ steps.stage.outputs.dir }}
        if-no-files-found: error
        compression-level: 6
